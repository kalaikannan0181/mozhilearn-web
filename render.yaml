services:
  - type: web
    name: mozhilearn-api
    runtime: node
    buildCommand: npm install && (python3 -m venv tts-main/tts-main/.venv && tts-main/tts-main/.venv/bin/pip install -r tts-main/tts-main/speech_to_text/requirements.txt || true)
    startCommand: node server/index.cjs
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"

      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: AI_API_KEY
        sync: false